<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Finance & Mortgage Calculator</title>

    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--dark); margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 24px auto 32px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e0e0e0; cursor: pointer; font-weight: bold; border-radius: 6px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button.calc-btn { width: 100%; padding: 12px; background: var(--dark); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #e8f8f0; border-left: 5px solid var(--primary); border-radius: 4px; font-size: 18px; font-weight: bold; }
        .ad-slot { margin: 25px 0; padding: 20px; background: #ebebeb; border: 2px dashed #bbb; text-align: center; color: #777; font-size: 12px; }
        .site-header,
        .site-footer { display: block; }
        .site-header { background: var(--dark); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 20; }
        .site-header .header-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: relative; }
        .site-header .title { margin: 0; font-size: 18px; }
        .site-header .subtitle { margin: 6px 0 0; font-size: 13px; color: #d1d5db; }
        .site-header .nav-toggle { display: none; background: transparent; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; color: white; width: 42px; height: 42px; font-size: 20px; cursor: pointer; }
        .site-header .nav-menu { display: none; margin-top: 12px; gap: 10px; flex-direction: column; }
        .site-header.expanded .nav-menu { display: flex; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .category-toggle { position: relative; background: transparent; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
        .category-toggle span,
        .category-toggle::before,
        .category-toggle::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 2px;
            background: #d1d5db;
            border-radius: 1px;
        }
        .category-toggle span { top: 50%; transform: translateY(-50%); }
        .category-toggle::before { top: 10px; }
        .category-toggle::after { bottom: 10px; }
        .category-toggle.open span,
        .category-toggle.open::before,
        .category-toggle.open::after { background: #8be5a2; }
        .category-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: min(260px, calc(100vw - 40px));
            background: rgba(44, 62, 80, 0.98);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transform: translateY(-10px);
            transition: opacity 0.2s ease, max-height 0.25s ease, transform 0.2s ease;
            z-index: 30;
        }
        .category-menu.expanded {
            opacity: 1;
            max-height: 240px;
            transform: translateY(0);
        }
        .category-btn { border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: white; border-radius: 10px; padding: 10px 14px; font-size: 13px; cursor: pointer; }
        .category-btn.active { background: rgba(255,255,255,0.14); }
        .nav-link { display: block; width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.05); color: white; text-align: left; font-weight: 600; cursor: pointer; }
        .nav-link.active { background: rgba(255,255,255,0.16); }
        .site-footer { background: var(--dark); color: #d1d5db; padding: 16px 20px; text-align: center; font-size: 14px; }
        .site-footer a { color: #8be5a2; text-decoration: none; }
        .footer-links { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

        @media (max-width: 720px) {
            body { padding: 0; }
            .site-header,
            .site-footer { display: block; }
            .site-header { padding-bottom: 12px; }
            .site-header .header-top { width: 100%; }
            .site-header .header-right { width: 100%; justify-content: flex-end; flex-direction: column; align-items: flex-end; margin-left: 0; }
            .header-actions { margin-left: auto; }
            .site-header .nav-menu { display: none; flex-direction: column; }
            .site-header.expanded .nav-menu { display: flex; }
            .container { margin: 0; border-radius: 0; min-height: calc(100vh - 172px); box-shadow: none; }
            .container { padding: 20px; }
            .tabs { flex-direction: column; }
            .tab-btn { width: 100%; }
            .nav-toggle { display: inline-flex; justify-content: center; align-items: center; }
            .category-menu { width: min(240px, calc(100vw - 40px)); right: 10px; }
        }
    </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-54P3J7K4"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header class="site-header">
    <div class="header-top">
        <div>
            <p class="title">Calculation Hub</p>
            <p class="subtitle">Quick finance tools optimized for mobile</p>
            <div class="category-menu" id="categoryMenu">
                <button class="category-btn active" onclick="setCategory('Finance', this)">Finance</button>
                <button class="category-btn" onclick="setCategory('Word Tools', this)">Word Tools</button>
            </div>
        </div>
        <div class="header-actions">
            <button class="category-toggle" aria-expanded="false" onclick="toggleCategoryMenu()"><span></span></button>
            <button class="nav-toggle" aria-expanded="false" onclick="toggleNav()">☰</button>
        </div>
    </div>
    <nav class="nav-menu" aria-label="Mobile navigation">
        <button class="nav-link active" onclick="switchTab('interest', this); toggleNav(false)">Compound Interest</button>
        <button class="nav-link" onclick="switchTab('mortgage', this); toggleNav(false)">Mortgage Payment</button>
        <a class="nav-link" href="word_counter.html">Word Counter</a>
    </nav>
</header>
<div class="container">
    <h2>📈 Wealth & Finance Calculator Hub</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('interest')">Compound Interest</button>
        <button class="tab-btn" onclick="switchTab('mortgage')">Mortgage Payment</button>
    </div>

    <!-- COMPOUND INTEREST -->
    <div id="interest" class="tab-content active">
        <div class="input-group"><label>Principal Amount ($)</label><input type="number" id="p-amount" value="5000"></div>
        <div class="input-group"><label>Annual Interest Rate (%)</label><input type="number" id="p-rate" value="7" step="0.1"></div>
        <div class="input-group"><label>Time Period (Years)</label><input type="number" id="p-years" value="10"></div>
        <button class="calc-btn" onclick="calcInterest()">Calculate Future Value</button>
        <div id="interest-res" class="result">Future Balance: $9,835.76</div>
    </div>

    <!-- AD SLOT POSITION 1 (Keeps users viewing ads while shifting tabs) -->
    <div class="ad-slot">
        <!-- calculation-hub-ad -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-1607159692390166"
            data-ad-slot="7543509719"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- MORTGAGE CALCULATOR -->
    <div id="mortgage" class="tab-content">
        <div class="input-group"><label>Home Price ($)</label><input type="number" id="m-price" value="300000"></div>
        <div class="input-group"><label>Down Payment ($)</label><input type="number" id="m-down" value="60000"></div>
        <div class="input-group"><label>Interest Rate (%)</label><input type="number" id="m-rate" value="5" step="0.1"></div>
        <div class="input-group"><label>Loan Term (Years)</label><input type="number" id="m-years" value="30"></div>
        <button class="calc-btn" onclick="calcMortgage()">Calculate Monthly Payment</button>
        <div id="mortgage-res" class="result">Monthly Payment: $1,288.37</div>
    </div>
</div>

<script>
    function switchTab(tabId, source) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (source) source.classList.add('active');
    }
    function toggleNav(forceOpen) {
        const header = document.querySelector('.site-header');
        const isOpen = typeof forceOpen === 'boolean' ? forceOpen : !header.classList.contains('expanded');
        header.classList.toggle('expanded', isOpen);
        document.querySelector('.nav-toggle').setAttribute('aria-expanded', isOpen);
    }
    function setCategory(category, element) {
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.toggle('active', btn === element));
        const subtitle = document.querySelector('.site-header .subtitle');
        if (category === 'Word Tools') {
            subtitle.textContent = 'Text utilities and quick calculators';
        } else {
            subtitle.textContent = 'Quick finance tools optimized for mobile';
        }
    }
    function toggleCategoryMenu(forceOpen) {
        const menu = document.getElementById('categoryMenu');
        const toggle = document.querySelector('.category-toggle');
        const isOpen = typeof forceOpen === 'boolean' ? forceOpen : !menu.classList.contains('expanded');
        menu.classList.toggle('expanded', isOpen);
        toggle.setAttribute('aria-expanded', isOpen);
        toggle.classList.toggle('open', isOpen);
    }
    function calcInterest() {
        let p = parseFloat(document.getElementById('p-amount').value);
        let r = parseFloat(document.getElementById('p-rate').value) / 100;
        let t = parseFloat(document.getElementById('p-years').value);
        let a = p * Math.pow((1 + r), t);
        document.getElementById('interest-res').innerText = `Future Balance: $${a.toFixed(2)}`;
    }
    function calcMortgage() {
        let p = parseFloat(document.getElementById('m-price').value) - parseFloat(document.getElementById('m-down').value);
        let r = (parseFloat(document.getElementById('m-rate').value) / 100) / 12;
        let n = parseFloat(document.getElementById('m-years').value) * 12;
        let m = p * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        document.getElementById('mortgage-res').innerText = `Monthly Payment: $${m.toFixed(2)}`;
    }
</script>
</div>
<footer class="site-footer">
    Built for fast mobile use — find more tools at Calculation Hub.
    <div class="footer-links">
        <a href="index.html">Finance Calculator</a>
        <a href="word_counter.html">Word Counter</a>
    </div>
</footer>
</body>
</html>
