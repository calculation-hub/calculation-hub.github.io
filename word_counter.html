<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Text Analyzer & Formatting Tool</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f3f4f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 750px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 180px; padding: 12px; border: 2px solid #e2e8f0; border-radius: 6px; resize: vertical; box-sizing: border-box; font-size: 16px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .stat-box { background: #eff6ff; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; color: #1e40af; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: 500; background: #4f46e5; color: white; }
        .btn-danger { background: #ef4444; }
        .ad-banner { width: 100%; height: 90px; background: #f9fafb; border: 1px solid #d1d5db; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 11px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>📝 Smart Text Formatting Tool</h2>
    <textarea id="text-input" placeholder="Type or paste your content here to format..." oninput="updateStats()"></textarea>
    
    <div class="stats-grid">
        <div class="stat-box">Words: <span id="word-count">0</span></div>
        <div class="stat-box">Characters: <span id="char-count">0</span></div>
        <div class="stat-box">Paragraphs: <span id="para-count">0</span></div>
    </div>

    <div class="actions">
        <button class="btn" onclick="transformText('upper')">UPPERCASE</button>
        <button class="btn" onclick="transformText('lower')">lowercase</button>
        <button class="btn" onclick="transformText('clean')">Trim Spaces</button>
        <button class="btn btn-danger" onclick="clearText()">Clear All</button>
    </div>

    <div class="ad-banner">
        <!-- ADSENSE LEADERBOARD CODE GOES HERE -->
        ADVERTISEMENT SLOT (728x90 Leaderboard)
    </div>
</div>

<script>
    const input = document.getElementById('text-input');
    function updateStats() {
        const text = input.value.trim();
        document.getElementById('word-count').innerText = text === '' ? 0 : text.split(/\s+/).length;
        document.getElementById('char-count').innerText = input.value.length;
        document.getElementById('para-count').innerText = text === '' ? 0 : input.value.split(/\n+/).filter(p => p.trim() !== '').length;
    }
    function transformText(type) {
        if(type === 'upper') input.value = input.value.toUpperCase();
        if(type === 'lower') input.value = input.value.toLowerCase();
        if(type === 'clean') input.value = input.value.replace(/\s+/g, ' ').trim();
        updateStats();
    }
    function clearText() {
        input.value = '';
        updateStats();
    }
</script>
</body>
</html>
