<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Text Analyzer & Formatting Tool</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1607159692390166"
     crossorigin="anonymous"></script>
    <style>
        :root { --primary: #4f46e5; --dark: #1f2937; --light: #f3f4f6; }
        body { font-family: system-ui, sans-serif; background: var(--light); padding: 0; margin: 0; color: #111827; }
        .site-header { background: var(--dark); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 20; }
        .site-header .header-top { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .site-header .title { margin: 0; font-size: 18px; font-weight: 700; }
        .site-header .subtitle { margin: 4px 0 0; font-size: 13px; color: #d1d5db; }
        .site-header nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .site-header nav a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.1); }
        .site-header nav a.active { background: rgba(255,255,255,0.2); }
        .wrapper { width: 100%; max-width: 750px; margin: 24px auto 32px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 180px; padding: 12px; border: 2px solid #e2e8f0; border-radius: 6px; resize: vertical; box-sizing: border-box; font-size: 16px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .stat-box { background: #eff6ff; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; color: #1e40af; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: 500; background: var(--primary); color: white; }
        .btn-danger { background: #ef4444; }
        .ad-banner { width: 100%; height: 90px; background: #f9fafb; border: 1px solid #d1d5db; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 11px; margin-top: 15px; }
        .site-footer { background: #111827; color: #d1d5db; text-align: center; padding: 16px 20px; font-size: 14px; }
        .site-footer a { color: #8be5a2; text-decoration: none; margin: 0 8px; }
        @media (max-width: 720px) {
            .wrapper { margin: 16px auto 24px; border-radius: 0; box-shadow: none; }
            .site-header .header-top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="header-top">
        <div>
            <p class="title">Calculation Hub</p>
            <p class="subtitle">Quick tools for everyday writing and finance</p>
        </div>
        <nav>
            <a href="index.html">Finance Calculator</a>
            <a href="word_counter.html" class="active">Word Counter</a>
        </nav>
    </div>
</header>

<div class="wrapper">
    <h2>📝 Smart Text Formatting Tool</h2>
    <textarea id="text-input" placeholder="Type or paste your content here to format..." oninput="updateStats()"></textarea>
    
    <div class="stats-grid">
        <div class="stat-box">Words: <span id="word-count">0</span></div>
        <div class="stat-box">Characters: <span id="char-count">0</span></div>
        <div class="stat-box">Paragraphs: <span id="para-count">0</span></div>
    </div>

    <div class="actions">
        <button class="btn" onclick="transformText('upper')">UPPERCASE</button>
        <button class="btn" onclick="transformText('lower')">lowercase</button>
        <button class="btn" onclick="transformText('clean')">Trim Spaces</button>
        <button class="btn btn-danger" onclick="clearText()">Clear All</button>
    </div>

    <div class="ad-banner">
        <!-- calculation-hub-ad -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-1607159692390166"
            data-ad-slot="7543509719"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
</div>

<script>
    const input = document.getElementById('text-input');
    function updateStats() {
        const text = input.value.trim();
        document.getElementById('word-count').innerText = text === '' ? 0 : text.split(/\s+/).length;
        document.getElementById('char-count').innerText = input.value.length;
        document.getElementById('para-count').innerText = text === '' ? 0 : input.value.split(/\n+/).filter(p => p.trim() !== '').length;
    }
    function transformText(type) {
        if(type === 'upper') input.value = input.value.toUpperCase();
        if(type === 'lower') input.value = input.value.toLowerCase();
        if(type === 'clean') input.value = input.value.replace(/\s+/g, ' ').trim();
        updateStats();
    }
    function clearText() {
        input.value = '';
        updateStats();
    }
</script>
</div>

<footer class="site-footer">
    Built for fast everyday use — browse more tools at Calculation Hub.
    <div>
        <a href="index.html">Finance Calculator</a>
        <a href="word_counter.html">Word Counter</a>
    </div>
</footer>
</body>
</html>
