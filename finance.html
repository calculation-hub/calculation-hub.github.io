<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calculator Tools</title>
    <meta name="description" content="Use our free finance calculator for compound interest and mortgage payment estimates.">
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--dark); margin: 0; padding: 0; }
        .site-header { background: var(--dark); color: white; padding: 16px 20px; }
        .site-header .wrap { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .site-header nav a { color: white; text-decoration: none; margin-left: 10px; }
        .container { max-width: 900px; margin: 24px auto 32px; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .breadcrumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: 0.95rem; color: #64748b; }
        .breadcrumbs a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .breadcrumbs .sep { color: #94a3b8; }
        .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #e5e7eb; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--dark); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .result { margin-top: 16px; padding: 12px; background: #e8f8f0; border-left: 5px solid var(--primary); border-radius: 4px; font-weight: bold; }
        .site-footer { background: var(--dark); color: #d1d5db; padding: 16px 20px; text-align: center; font-size: 14px; }
        .site-footer a { color: #8be5a2; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
<header class="site-header">
    <div class="wrap">
        <div>
            <strong>Calculation Hub</strong><br>
            <small>Finance calculator tools</small>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="word_counter.html">Word Counter</a>
        </nav>
    </div>
</header>
<div class="container">
    <div class="breadcrumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep">/</span>
        <span>Finance Tools</span>
    </div>
    <h1>Finance Calculator Tools</h1>
    <p>Estimate compound interest growth and monthly mortgage payments with these simple tools.</p>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('interest')">Compound Interest</button>
        <button class="tab-btn" onclick="switchTab('mortgage')">Mortgage Payment</button>
    </div>
    <div id="interest" class="tab-content active">
        <div class="input-group"><label>Principal Amount ($)</label><input type="number" id="p-amount" value="5000"></div>
        <div class="input-group"><label>Annual Interest Rate (%)</label><input type="number" id="p-rate" value="7" step="0.1"></div>
        <div class="input-group"><label>Time Period (Years)</label><input type="number" id="p-years" value="10"></div>
        <button onclick="calcInterest()">Calculate Future Value</button>
        <div id="interest-res" class="result">Future Balance: $9,835.76</div>
    </div>
    <div id="mortgage" class="tab-content">
        <div class="input-group"><label>Home Price ($)</label><input type="number" id="m-price" value="300000"></div>
        <div class="input-group"><label>Down Payment ($)</label><input type="number" id="m-down" value="60000"></div>
        <div class="input-group"><label>Interest Rate (%)</label><input type="number" id="m-rate" value="5" step="0.1"></div>
        <div class="input-group"><label>Loan Term (Years)</label><input type="number" id="m-years" value="30"></div>
        <button onclick="calcMortgage()">Calculate Monthly Payment</button>
        <div id="mortgage-res" class="result">Monthly Payment: $1,288.37</div>
    </div>
</div>
<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`).classList.add('active');
    }
    function calcInterest() {
        let p = parseFloat(document.getElementById('p-amount').value);
        let r = parseFloat(document.getElementById('p-rate').value) / 100;
        let t = parseFloat(document.getElementById('p-years').value);
        let a = p * Math.pow((1 + r), t);
        document.getElementById('interest-res').innerText = `Future Balance: $${a.toFixed(2)}`;
    }
    function calcMortgage() {
        let p = parseFloat(document.getElementById('m-price').value) - parseFloat(document.getElementById('m-down').value);
        let r = (parseFloat(document.getElementById('m-rate').value) / 100) / 12;
        let n = parseFloat(document.getElementById('m-years').value) * 12;
        let m = p * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        document.getElementById('mortgage-res').innerText = `Monthly Payment: $${m.toFixed(2)}`;
    }
</script>
<footer class="site-footer">
    <a href="index.html">Home</a>
    <a href="word_counter.html">Word Counter</a>
</footer>
</body>
</html>
